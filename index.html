<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Warren Peace</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <span class="stat" title="Carrots">🥕 <b id="carrots">0</b></span>
        <span class="stat" id="bunny-stat" title="Bunnies at work / bunnies you have (housing)">🐇 <b id="bunnies">0</b></span>
        <span class="stat" id="volt-stat" title="Volts used / Volts generated">⚡ <b id="volts">0</b></span>
        <span class="stat" id="night"></span>
        <span class="stat grow" id="status"></span>
        <span class="stat" title="Golden Carrot health">
          <span class="hp"><span id="carrot-hp"></span></span>
        </span>
      </header>
      <main id="stage">
        <canvas id="game"></canvas>
        <div id="overlay" hidden>
          <div class="card">
            <h1 id="overlay-title"></h1>
            <div id="overlay-body"></div>
            <button id="overlay-button" class="primary"></button>
          </div>
        </div>
      </main>
      <footer id="bar">
        <div id="tool-info"></div>
        <div id="tools"></div>
        <div id="actions">
          <button id="guide" title="Statuses, combos and side-by-side bonuses">Combos</button>
          <button id="speed" title="Game speed">1×</button>
          <button id="start-night" class="primary"></button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
